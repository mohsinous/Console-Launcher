name: Build Console Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "Console Launcher" --icon "EmulatorLauncher.ico" main.py

      - name: Prepare release package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release\icons | Out-Null
          Copy-Item dist\*.exe release\
          Copy-Item main.py release\
          Copy-Item EmulatorLauncher.ico release\
          if (Test-Path icons\*) {
            Copy-Item icons\* release\icons\ -Recurse -Force
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Console-Launcher-Windows
          path: release\

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Console Launcher.exe
            release/main.py
            release/EmulatorLauncher.ico
            release/icons/**
          generate_release_notes: true
