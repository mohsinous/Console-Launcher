name: Build and Release Console Launcher

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ConsoleLauncher main.py

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/ConsoleLauncher/ConsoleLauncher.exe')) {
            throw 'ConsoleLauncher.exe was not created.'
          }

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/ConsoleLauncher/*' -DestinationPath 'ConsoleLauncher-Windows-x64.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleLauncher-Windows-x64
          path: ConsoleLauncher-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ConsoleLauncher-Windows-x64.zip
