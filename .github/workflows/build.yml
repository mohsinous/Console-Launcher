name: Build and Release Console Launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Build application
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed main.py

      - name: Verify build
        shell: powershell
        run: |
          if (-not (Test-Path "dist\ConsoleLauncher.exe")) {
            Write-Error "ConsoleLauncher.exe was not created."
            exit 1
          }

      - name: Create release archive
        shell: powershell
        run: |
          $version = "${{ inputs.version }}"
          $zipName = "ConsoleLauncher-Windows-x64-v$version.zip"

          Compress-Archive `
            -Path "dist\ConsoleLauncher.exe" `
            -DestinationPath $zipName `
            -Force

          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleLauncher-Windows-x64
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Console Launcher v${{ inputs.version }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
          make_latest: true
