name: Build Console Launcher

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build Console Launcher
        run: |
          pyinstaller --onefile --windowed --name "Console Launcher" --icon "EmulatorLauncher.ico" main.py

      - name: Prepare final package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package\icons | Out-Null

          Copy-Item "dist\Console Launcher.exe" "package\Console Launcher.exe"

          if (Test-Path "icons\*") {
              Copy-Item "icons\*" "package\icons\" -Recurse -Force
          }

      - name: Create final ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "Console-Launcher-Windows.zip" `
            -Force

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: Console-Launcher-Windows
          path: Console-Launcher-Windows.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Console Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: Console-Launcher-Windows.zip
